<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <style>
      .txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
      .prompt { fill: #38bdf8; font-weight: 600; }
      .cmd { fill: #f8fafc; font-weight: 500; }
      .success { fill: #10b981; font-weight: 600; }
      .info { fill: #94a3b8; }
      .highlight { fill: #a855f7; font-weight: 600; }
      .badge { fill: #38bdf8; font-weight: 600; }
      
      /* Animation sequencing */
      @keyframes fadeStep1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
      @keyframes fadeStep2 { 0%, 20% { opacity: 0; } 25%, 100% { opacity: 1; } }
      @keyframes fadeStep3 { 0%, 38% { opacity: 0; } 43%, 100% { opacity: 1; } }
      @keyframes fadeStep4 { 0%, 56% { opacity: 0; } 62%, 100% { opacity: 1; } }
      @keyframes fadeStep5 { 0%, 75% { opacity: 0; } 80%, 100% { opacity: 1; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .step1 { animation: fadeStep1 10s infinite; }
      .step2 { animation: fadeStep2 10s infinite; }
      .step3 { animation: fadeStep3 10s infinite; }
      .step4 { animation: fadeStep4 10s infinite; }
      .step5 { animation: fadeStep5 10s infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="848" height="278" rx="12" fill="url(#terminalBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 1 13 C 1 6.5 6.5 1 13 1 L 837 1 C 843.5 1 849 6.5 849 13 L 849 38 L 1 38 Z" fill="#0f172a" opacity="0.95"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="19" r="6" fill="#ef4444"/>
  <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="19" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="425" y="23" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    vikrant@orchestrator: ~/ai-production-pipeline (LangGraph &amp; MCP)
  </text>
  
  <rect x="730" y="10" width="105" height="19" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <circle cx="742" cy="19.5" r="3.5" fill="#10b981"/>
  <text x="752" y="23.5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700">LIVE SYSTEM</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Command Initiation -->
  <g class="step1">
    <text x="24" y="70" class="txt prompt">vikrant@ai-core:~$</text>
    <text x="175" y="70" class="txt cmd">deploy-agentic-workflow --schema=strict --target=production</text>
  </g>

  <!-- Line 2: Orchestration Layer -->
  <g class="step2">
    <text x="24" y="105" class="txt success">[✓]</text>
    <text x="48" y="105" class="txt info">Orchestration Layer:</text>
    <text x="205" y="105" class="txt highlight">Initialized LangGraph Supervisor</text>
    <text x="475" y="105" class="txt info">(StateGraph &amp; Typed Dict checkpoints)</text>
  </g>

  <!-- Line 3: Model Context Protocol (MCP) -->
  <g class="step3">
    <text x="24" y="140" class="txt success">[✓]</text>
    <text x="48" y="140" class="txt info">Protocol Tooling:</text>
    <text x="185" y="140" class="txt badge">Bound MCP Client Tools</text>
    <text x="360" y="140" class="txt info">(Database, Filesystem &amp; External REST APIs)</text>
  </g>

  <!-- Line 4: Validation Engine -->
  <g class="step4">
    <text x="24" y="175" class="txt success">[✓]</text>
    <text x="48" y="175" class="txt info">Contract Validation:</text>
    <text x="210" y="175" class="txt success">Strict JSON Schemas Enforced</text>
    <text x="455" y="175" class="txt info">(0 Hallucination Execution Policy)</text>
  </g>

  <!-- Line 5: Execution Result -->
  <g class="step5">
    <text x="24" y="210" class="txt success">[✓]</text>
    <text x="48" y="210" class="txt info">Deterministic Execution:</text>
    <text x="235" y="210" class="txt highlight">Enterprise Mutations Verified</text>
    <text x="465" y="210" class="txt info">(Enterprise SDLC &amp; QA Standards)</text>
  </g>

  <!-- Line 6: Ready Status -->
  <g class="step5">
    <rect x="24" y="235" width="802" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="36" y="254" class="txt success">STATUS: 200 OK</text>
    <text x="155" y="254" class="txt info">• Latency: 320ms • Audit Log Checkpointed • System Ready for Client Work</text>
    <rect x="715" y="243" width="8" height="13" fill="#38bdf8" class="cursor"/>
  </g>
</svg>
